x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  environment:
    AIRFLOW_UID: ${AIRFLOW_UID}

    # Airflow Core
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor  
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Metadata Database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}

    # Logging
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"

    # Scheduler
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"

    # Docker
    PYTHONUNBUFFERED: "1"

  user: "${AIRFLOW_UID}:0"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./docker:/opt/airflow/docker

  restart: unless-stopped

services:

  airflow-init:
    <<: *airflow-common

    container_name: airflow-init
    hostname: airflow-init

    command: >
      bash /opt/airflow/docker/airflow-init.sh

    restart: "no"

  airflow-webserver:
    <<: *airflow-common

    container_name: airflow-webserver
    hostname: airflow-webserver

    command: airflow api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:8080/api/v2/monitor/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common

    container_name: airflow-scheduler
    hostname: airflow-scheduler

    command: airflow scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$(hostname)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  airflow-dag-processor:
    <<: *airflow-common

    container_name: airflow-dag-processor
    hostname: airflow-dag-processor

    command: airflow dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$(hostname)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s